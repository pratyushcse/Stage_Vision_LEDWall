<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Stage Vision LED Displays | Coming Soon</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700;800;900&display=swap"
          rel="stylesheet">
</head>

<body>

    <main class="hero">

        <!-- Background effects -->
        <div class="cyan-glow"></div>
        <div class="yellow-glow"></div>

        <!-- Background particles -->
        <div class="particles"></div>


        <!-- LEFT CONTENT -->
        <section class="content">

            <!-- YOUR LOGO -->
            <div class="logo-box">
                <img src="logo.png" alt="Stage Vision LED Displays">
            </div>


            <!-- COMING SOON -->
            <div class="coming">

                <h1>
                    COMING
                    <span>SOON</span>
                </h1>

                <div class="line"></div>

                <p class="tagline">
                    <span>BIGGER SCREENS.</span>
                    <span>BETTER EXPERIENCES.</span>
                </p>

            </div>


            <!-- LOCATION -->
            <div class="location">

                <div class="pin">
                    ●
                </div>

                <span>MANGALORE</span>

                <div class="location-line"></div>

            </div>

        </section>


        <!-- RIGHT LED WALL -->
        <section class="stage">

            <div class="truss top-truss"></div>
            <div class="truss left-truss"></div>
            <div class="truss right-truss"></div>

            <!-- Lights -->
            <div class="light light1"></div>
            <div class="light light2"></div>
            <div class="light light3"></div>
            <div class="light light4"></div>


            <!-- LED SCREEN -->
            <div class="led-wall">

                <div class="led-glow"></div>

                <div class="led-content">
                    <span>STAGE</span>
                    <span>VISION</span>
                </div>

            </div>

            <div class="floor"></div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
